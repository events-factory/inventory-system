version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "9000:8000"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    # Lets the container reach services running on the server host (e.g. host MySQL).
    # Requires Docker 20.10+; on Linux this maps host.docker.internal to the docker bridge gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      bash -c "
        composer install --no-interaction --optimize-autoloader --prefer-dist &&
        php artisan config:clear &&
        php artisan serve --host=0.0.0.0 --port=8000
      "